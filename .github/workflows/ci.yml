name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest -q
      - run: uv run ruff check backend scripts
      - run: PYTHONPATH=backend uv run python scripts/openapi.py
      - run: git diff --exit-code openapi.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run api:types && git diff --exit-code src/api-types.ts
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
  container-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t study-api .
      - run: docker run -d --name study-api --memory=512m --cpus=1 -p 8000:8000 study-api
      - name: Verify sample startup within 512 MiB
        run: |
          python - <<'PY'
          import json, time, urllib.request
          for attempt in range(60):
              try:
                  health = json.load(urllib.request.urlopen('http://localhost:8000/api/health'))
                  if health['samples_ready']:
                      break
                  if health['error']:
                      raise RuntimeError(health['error'])
              except (ConnectionError, OSError):
                  pass
              time.sleep(2)
          else:
              raise RuntimeError('Sample startup failed under the memory limit')
          PY
      - if: always()
        run: docker inspect study-api --format '{{json .State}}' && docker logs study-api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
