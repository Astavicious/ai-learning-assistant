[project]
name = "ai-learning-assistant"
version = "0.1.0"
description = "Page-grounded PDF study workspace; expansion of a 2025 prototype"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1", "pypdf>=5.4,<7", "numpy>=2.2,<3",
  "fastembed>=0.6,<1", "groq>=0.24,<1", "httpx>=0.28,<1",
]
[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "reportlab>=4.3,<5", "psutil>=7,<8"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
